<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Estudio por temas para el examen AWS Certified Solutions Architect – Associate (SAA-C03)." />
    <title>SAA-C03 · Estudio por temas</title>
    <script>
      // Apply the saved theme before first paint so the page never flashes.
      try {
        var t = localStorage.getItem('saa.theme');
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
